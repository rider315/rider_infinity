[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers

# Warnings are errors: this suite exists to catch silent breakage, and a
# DeprecationWarning here is tomorrow's hard failure (the code-base was
# full of datetime.utcnow(), which Python has scheduled for removal).
filterwarnings =
    error
    # pandas/numpy emit these from their own internals on import.
    default::DeprecationWarning:pandas
    default::DeprecationWarning:numpy
